<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bachman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one arcade cabinet screen, centred, scaled to fit; d-pad below on touch devices. */
  :root {
    --night: #120f24;      /* page + maze floor */
    --hedge: #2f8f5b;      /* maze walls (holly green) */
    --hedge-hi: #7fe0a3;   /* wall edge glow */
    --mustard: #ffcf4a;    /* score + accents */
    --cream: #f6ecd9;      /* text, the dog's fur */
    --berry: #e2475a;      /* warnings, holly berries */
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--cream);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #game {
    display: block;
    max-width: 100%;
    image-rendering: auto;
    border-radius: 14px;
    box-shadow: 0 0 0 2px #2a2448, 0 18px 50px rgba(0, 0, 0, 0.55);
    outline: none;
  }
  .help {
    margin: 0;
    font-size: 13px;
    color: #b9b0d6;
    text-align: center;
    max-width: 60ch;
  }
  .help kbd {
    font-family: var(--font-body);
    font-weight: 800;
    background: #241e40;
    border: 1px solid #3a3266;
    border-radius: 5px;
    padding: 0 5px;
    color: var(--cream);
  }
  .pad {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 50px);
    gap: 6px;
  }
  .pad button {
    font: 800 22px var(--font-body);
    color: var(--cream);
    background: #241e40;
    border: 1px solid #3a3266;
    border-radius: 12px;
    touch-action: none;
  }
  .pad button:active { background: var(--hedge); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) {
    .pad { display: grid; }
    .help .keys { display: none; }
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Bachman game. Use the arrow keys to move."></canvas>
<p class="help"><span class="keys">Move with <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> · <kbd>P</kbd> pause · <kbd>M</kbd> sound. </span>Swipe on the maze or use the pad on a phone.</p>
<div class="pad" aria-hidden="true">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>
<script>
(() => {
"use strict";

/* ------------------------------------------------------------------
   Maze legend
   #  hedge wall            .  pig in blanket       o  bone (power-up)
   -  door (chasers only)  G  chasers' den (inside)  P  dog start
   (space) outside the maze / empty floor
   ------------------------------------------------------------------ */
const MAZE = [
  "#####################",
  "#.........#.........#",
  "#o##.####.#.####.##o#",
  "#...................#",
  "#.##.#.#######.#.##.#",
  "#....#....#....#....#",
  "####.####.#.####.####",
  "   #.#.........#.#   ",
  "####.#.###-###.#.####",
  ".....#.#GGGGG#.#.....",
  "####.#.#######.#.####",
  "   #.#.........#.#   ",
  "####.####.#.####.####",
  "#.........#.........#",
  "#.##.####.#.####.##.#",
  "#..#......P......#..#",
  "#o.#.#.#######.#.#.o#",
  "#....#....#....#....#",
  "#.#######.#.#######.#",
  "#...................#",
  "#####################",
];

const COLS = MAZE[0].length;
const ROWS = MAZE.length;
const T = 24;                 // tile size in logical pixels
const HUD_TOP = 46;
const HUD_BOTTOM = 40;
const W = COLS * T;
const H = ROWS * T + HUD_TOP + HUD_BOTTOM;

const DOOR = { x: 10, y: 8 };
const HOUSE_Y = 9;
const EXIT = { x: 10, y: 7 };  // tile just outside the cat-flap
const TUNNEL_ROW = 9;

const DIRS = {
  up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
  left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  none: { x: 0, y: 0 },
};
const DIR_ORDER = ["up", "left", "down", "right"]; // tie-break order for cats

/* ---------------------------- canvas ---------------------------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const pad = document.querySelector(".pad");
  const padH = getComputedStyle(pad).display === "none" ? 0 : 130;
  const availW = window.innerWidth - 32;
  const availH = window.innerHeight - 70 - padH;
  const scale = Math.max(0.4, Math.min(availW / W, availH / H, 2));
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.round(W * dpr * scale);
  canvas.height = Math.round(H * dpr * scale);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  renderScale = dpr * scale;
  buildWallLayer();
}
let renderScale = 1;
window.addEventListener("resize", resize);

/* ---------------------------- storage --------------------------- */
function loadHigh() { try { return +localStorage.getItem("bachman-high") || 0; } catch (e) { return 0; } }
function saveHigh(v) { try { localStorage.setItem("bachman-high", String(v)); } catch (e) { /* ignore */ } }

/* ---------------------------- sound ----------------------------- */
const Sound = (() => {
  let ac = null, muted = false, chompFlip = false;
  try { muted = localStorage.getItem("bachman-muted") === "1"; } catch (e) { /* ignore */ }
  function ensure() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
    }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type = "square", vol = 0.08, slideTo = null, delay = 0) {
    if (muted) return;
    const a = ensure(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function bark(delay = 0) {
    if (muted) return;
    const a = ensure(); if (!a) return;
    const t0 = a.currentTime + delay;
    // pitched yap
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(520, t0);
    o.frequency.exponentialRampToValueAtTime(300, t0 + 0.12);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 1.2;
    o.connect(f).connect(g).connect(a.destination);
    o.start(t0); o.stop(t0 + 0.16);
  }
  return {
    unlock: ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("bachman-muted", muted ? "1" : "0"); } catch (e) {} },
    chomp() { chompFlip = !chompFlip; tone(chompFlip ? 330 : 250, 0.07, "triangle", 0.09); },
    bone() { tone(220, 0.35, "square", 0.06, 880); bark(0.05); },
    eatCat() { tone(300, 0.25, "square", 0.07, 1400); },
    bonus() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.1, "triangle", 0.08, null, i * 0.08)); },
    death() { tone(700, 1.1, "sawtooth", 0.06, 80); },
    start() { [392, 523, 659, 523, 784].forEach((f, i) => tone(f, 0.14, "square", 0.05, null, i * 0.15)); bark(0.8); bark(0.98); },
    extra() { [659, 880, 1175].forEach((f, i) => tone(f, 0.12, "triangle", 0.08, null, i * 0.1)); },
    bark,
  };
})();

/* --------------------------- sprites ---------------------------- */
function makeSprite(w, h, draw) {
  const c = document.createElement("canvas");
  const s = 3; // draw sprites at 3x so they stay crisp when scaled
  c.width = w * s; c.height = h * s;
  const g = c.getContext("2d");
  g.scale(s, s);
  draw(g, w, h);
  return c;
}

// Pig in blanket: a little sausage with a bacon wrap, drawn on a slant.
const pigSprite = makeSprite(T, T, (g, w, h) => {
  g.translate(w / 2, h / 2);
  g.rotate(-0.5);
  const L = 15, R = 3.6;
  // sausage
  const grad = g.createLinearGradient(0, -R, 0, R);
  grad.addColorStop(0, "#d7794a"); grad.addColorStop(0.5, "#b5532c"); grad.addColorStop(1, "#7f3418");
  g.fillStyle = grad;
  roundRect(g, -L / 2, -R, L, R * 2, R); g.fill();
  // shine
  g.fillStyle = "rgba(255,230,200,0.55)";
  roundRect(g, -L / 2 + 2, -R + 1, L - 6, 1.4, 0.7); g.fill();
  // bacon wrap
  const bw = 7.5;
  g.save();
  g.beginPath(); g.rect(-bw / 2, -R - 1.2, bw, R * 2 + 2.4); g.clip();
  g.fillStyle = "#e88f8a";
  roundRect(g, -bw / 2, -R - 1.2, bw, R * 2 + 2.4, 1.6); g.fill();
  g.fillStyle = "#fbd9cf"; // fat stripes
  g.fillRect(-bw / 2, -R + 0.6, bw, 1.3);
  g.fillRect(-bw / 2, R - 2.2, bw, 1.1);
  g.fillStyle = "#b8473f";
  g.fillRect(-bw / 2, -0.4, bw, 1.0);
  g.restore();
  g.strokeStyle = "rgba(80,20,10,0.5)"; g.lineWidth = 0.6;
  roundRect(g, -bw / 2, -R - 1.2, bw, R * 2 + 2.4, 1.6); g.stroke();
});

// Bone: the power-up.
const boneSprite = makeSprite(T, T, (g, w, h) => {
  g.translate(w / 2, h / 2);
  g.rotate(-0.6);
  g.fillStyle = "#fff7e6";
  g.strokeStyle = "#c9b48c"; g.lineWidth = 1;
  const L = 7.5, k = 3.4;
  g.beginPath();
  g.rect(-L, -2.2, L * 2, 4.4);
  [[-L, -k + 1.2], [-L, k - 1.2], [L, -k + 1.2], [L, k - 1.2]].forEach(([x, y]) => {
    g.moveTo(x + k, y); g.arc(x, y, k, 0, Math.PI * 2);
  });
  g.fill();
  g.globalCompositeOperation = "destination-over";
  g.stroke();
  g.globalCompositeOperation = "source-over";
  g.fillStyle = "rgba(255,255,255,0.9)";
  g.fillRect(-L + 1, -1.6, L * 2 - 2, 1.1);
});

// Christmas pudding: the bonus item.
const puddingSprite = makeSprite(T * 1.4, T * 1.4, (g, w, h) => {
  const cx = w / 2, cy = h / 2 + 2, r = 11;
  const grad = g.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, r);
  grad.addColorStop(0, "#8a4a2a"); grad.addColorStop(1, "#3e1d10");
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#1f0e06";
  for (let i = 0; i < 9; i++) {
    const a = i * 2.4, d = 3 + (i % 3) * 2.6;
    g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + 3 + Math.sin(a) * d * 0.6, 0.9, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = "#fffaf0";
  g.beginPath();
  g.moveTo(cx - r + 1, cy - 3);
  g.quadraticCurveTo(cx, cy - r - 4, cx + r - 1, cy - 3);
  for (let i = 0; i <= 6; i++) {
    const x = cx + r - 1 - i * ((2 * r - 2) / 6);
    g.quadraticCurveTo(x + 1.5, cy + (i % 2 ? 2.5 : -1), x, cy - 2);
  }
  g.closePath(); g.fill();
  g.fillStyle = "#2f8f5b";
  g.beginPath(); g.ellipse(cx - 3.5, cy - r + 0.5, 3.6, 1.8, -0.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx + 3.5, cy - r + 0.5, 3.6, 1.8, 0.5, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#e2475a";
  [[-1, -r - 1], [1.5, -r - 1.5], [0.3, -r + 1]].forEach(([x, y]) => { g.beginPath(); g.arc(cx + x, cy + y, 1.5, 0, Math.PI * 2); g.fill(); });
});

function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ----------------------- the Havanese head ---------------------- */
// Fur tufts are fixed so the dog doesn't shimmer.
const TUFTS = Array.from({ length: 18 }, (_, i) => {
  const a = (i / 18) * Math.PI * 2;
  return { a, d: 0.8 + ((i * 7) % 5) * 0.025, s: 0.2 + ((i * 3) % 4) * 0.025 };
});
function drawDog(g, cx, cy, r, face, look, mouth, opts = {}) {
  // face: 1 looking right, -1 looking left. look: -1 up .. 1 down. mouth: 0 closed .. 1 open.
  g.save();
  g.translate(cx, cy);
  if (opts.rotate) g.rotate(opts.rotate);
  if (opts.scale != null) g.scale(opts.scale, opts.scale);
  const fx = face * r * 0.13;
  const fy = look * r * 0.1;

  // fluffy white head, a touch of grey on the crown
  const hg = g.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
  hg.addColorStop(0, "#ffffff"); hg.addColorStop(0.75, "#f1f0f2"); hg.addColorStop(1, "#c9c7cf");
  g.fillStyle = hg;
  g.beginPath(); g.arc(0, 0, r * 0.82, 0, Math.PI * 2); g.fill();
  for (const t of TUFTS) {
    if (t.a > 0.3 && t.a < Math.PI - 0.3) continue;
    g.beginPath();
    g.arc(Math.cos(t.a) * r * t.d, Math.sin(t.a) * r * t.d, r * t.s, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = "rgba(150,150,160,0.35)";
  g.beginPath(); g.ellipse(fx * 0.5, -r * 0.62 + fy * 0.4, r * 0.42, r * 0.2, 0, 0, Math.PI * 2); g.fill();

  // floppy black ears with curly tips (light rim so they read on the dark floor)
  for (const side of [-1, 1]) {
    const earX = side * r * 0.78 - fx * 0.3;
    const swing = Math.sin(opts.t * 10 || 0) * 0.06 * (opts.moving ? 1 : 0);
    g.save();
    g.translate(earX, -r * 0.38);
    g.rotate(side * (0.22 + swing));
    g.fillStyle = "#16141a";
    g.strokeStyle = "rgba(200,195,230,0.45)";
    g.lineWidth = Math.max(0.8, r * 0.05);
    g.beginPath();
    g.ellipse(0, r * 0.45, r * 0.32, r * 0.62, 0, 0, Math.PI * 2);
    g.stroke(); g.fill();
    for (let i = 0; i < 4; i++) {
      g.beginPath();
      g.arc((i - 1.5) * r * 0.14, r * 0.98, r * 0.12, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = "rgba(255,255,255,0.12)"; // glossy curl
    g.beginPath(); g.ellipse(-side * r * 0.08, r * 0.3, r * 0.08, r * 0.3, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  // black patches round both eyes, joining the ears, with a white blaze between
  const eyeY = -r * 0.12 + fy;
  g.fillStyle = "#16141a";
  for (const side of [-1, 1]) {
    g.beginPath();
    g.ellipse(side * r * 0.4 + fx, eyeY + r * 0.02, r * 0.3, r * 0.26, side * 0.35, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.ellipse(side * r * 0.6 + fx * 0.5, eyeY - r * 0.12, r * 0.22, r * 0.2, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.fillStyle = "#ffffff"; // blaze
  g.beginPath();
  g.ellipse(fx, eyeY - r * 0.05, r * 0.11, r * 0.36, 0, 0, Math.PI * 2);
  g.fill();

  // brown eyes
  for (const side of [-1, 1]) {
    const ex = side * r * 0.32 + fx;
    if (opts.dizzy) {
      g.strokeStyle = "#ffffff"; g.lineWidth = r * 0.07;
      g.beginPath();
      g.moveTo(ex - r * 0.09, eyeY - r * 0.09); g.lineTo(ex + r * 0.09, eyeY + r * 0.09);
      g.moveTo(ex + r * 0.09, eyeY - r * 0.09); g.lineTo(ex - r * 0.09, eyeY + r * 0.09);
      g.stroke();
      continue;
    }
    g.fillStyle = "#6b3a1f";
    g.beginPath(); g.arc(ex, eyeY, r * 0.12, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1a0d06";
    g.beginPath(); g.arc(ex, eyeY, r * 0.065, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fff";
    g.beginPath(); g.arc(ex + r * 0.04 * face, eyeY - r * 0.05, r * 0.035, 0, Math.PI * 2); g.fill();
  }

  // muzzle (white with a hint of cream whiskers)
  const mx = fx * 1.2, my = r * 0.28 + fy;
  g.fillStyle = "#fbf6ee";
  g.beginPath(); g.ellipse(mx, my, r * 0.36, r * 0.26, 0, 0, Math.PI * 2); g.fill();

  // open mouth with tongue
  if (mouth > 0.05) {
    const mh = r * 0.32 * mouth;
    g.fillStyle = "#5a1a1a";
    g.beginPath(); g.ellipse(mx, my + r * 0.16, r * 0.24, mh, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#ef7f93";
    g.beginPath(); g.ellipse(mx, my + r * 0.16 + mh * 0.45, r * 0.15, mh * 0.55, 0, 0, Math.PI * 2); g.fill();
  } else {
    g.strokeStyle = "#5b3a27"; g.lineWidth = r * 0.05; g.lineCap = "round";
    g.beginPath();
    g.arc(mx - r * 0.08, my + r * 0.08, r * 0.08, 0.2, Math.PI - 0.2);
    g.arc(mx + r * 0.08, my + r * 0.08, r * 0.08, 0.2, Math.PI - 0.2);
    g.stroke();
  }

  // nose
  g.fillStyle = "#151010";
  g.beginPath(); g.ellipse(mx, my - r * 0.07, r * 0.11, r * 0.08, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "rgba(255,255,255,0.6)";
  g.beginPath(); g.arc(mx - r * 0.03, my - r * 0.1, r * 0.025, 0, Math.PI * 2); g.fill();

  g.restore();
}

/* ---------------------------- chasers --------------------------- */
// The chasers are all Olivia, told apart by the colour of their chunky knit jumper.
const CAT_LOOKS = [
  { name: "Olivia",     knit: "#e3283f", rib: "#b41a2e", label: "#ff6b7d" },
  { name: "Olivia",   knit: "#2fa36b", rib: "#1d7a4d", label: "#6fdca3" },
  { name: "Olivia",    knit: "#3f6fe0", rib: "#2a4fb0", label: "#8fb0ff" },
  { name: "Olivia", knit: "#e6a823", rib: "#b37f10", label: "#ffd25e" },
];
const FRECKLES = Array.from({ length: 14 }, (_, i) => ({
  x: Math.sin(i * 12.9898) * 0.5, y: Math.cos(i * 78.233) * 0.5,
}));
function drawCat(g, cat, t) {
  const cx = cat.x * T + T / 2, cy = cat.y * T + T / 2 + HUD_TOP;
  const r = T * 0.66;
  const d = DIRS[cat.dir] || DIRS.none;
  const scared = cat.mode === "frightened";
  const eyesOnly = cat.mode === "eaten" || cat.mode === "entering";
  let skin = "#f4cdb3", skinShade = "#e2ad91", hair = "#d39a5e", hairHi = "#ebbd84";
  let knit = cat.look.knit, rib = cat.look.rib;
  if (scared) {
    const flash = game.frightLeft < 2 && Math.floor(game.frightLeft * 5) % 2 === 0;
    skin = flash ? "#f4f4ff" : "#8fa0f0"; skinShade = flash ? "#d8d8f0" : "#6c7ed8";
    hair = flash ? "#d0d0ee" : "#4f5fd8"; hairHi = flash ? "#ffffff" : "#6d7cf0";
    knit = flash ? "#e8e8ff" : "#3a48b8"; rib = flash ? "#c8c8ea" : "#2a3690";
  }
  const bob = eyesOnly ? 0 : Math.sin(t * 12 + cat.id) * r * 0.04;
  const tilt = scared ? Math.sin(t * 9 + cat.id) * 0.12 : 0;
  g.save();
  g.translate(cx, cy + bob);
  g.rotate(tilt);

  if (!eyesOnly) {
    // red ribbed turtleneck
    g.fillStyle = knit;
    roundRect(g, -r * 0.62, r * 0.48, r * 1.24, r * 0.55, r * 0.25); g.fill();
    g.fillStyle = rib;
    roundRect(g, -r * 0.42, r * 0.36, r * 0.84, r * 0.3, r * 0.14); g.fill();
    g.strokeStyle = "rgba(0,0,0,0.22)"; g.lineWidth = 0.7;
    for (let i = -3; i <= 3; i++) {
      g.beginPath(); g.moveTo(i * r * 0.11, r * 0.39); g.lineTo(i * r * 0.11, r * 0.63); g.stroke();
    }
    for (let i = -4; i <= 4; i++) {
      g.beginPath(); g.moveTo(i * r * 0.13, r * 0.72); g.lineTo(i * r * 0.13, r * 1.0); g.stroke();
    }

    // hair behind the head: pulled back, with wispy strands
    g.fillStyle = hair;
    g.beginPath(); g.ellipse(0, -r * 0.18, r * 0.58, r * 0.62, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = hairHi; g.lineWidth = 0.8;
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * r * 0.52, -r * 0.1);
      g.quadraticCurveTo(s * r * 0.7, r * 0.15, s * r * 0.6, r * 0.35); g.stroke();
    }

    // face
    const fg = g.createRadialGradient(-r * 0.1, -r * 0.2, r * 0.1, 0, -r * 0.05, r * 0.6);
    fg.addColorStop(0, skin); fg.addColorStop(1, skinShade);
    g.fillStyle = fg;
    g.beginPath(); g.ellipse(0, -r * 0.02, r * 0.46, r * 0.52, 0, 0, Math.PI * 2); g.fill();
    // ears with daisy studs
    for (const s of [-1, 1]) {
      g.fillStyle = skinShade;
      g.beginPath(); g.ellipse(s * r * 0.46, -r * 0.02, r * 0.08, r * 0.13, 0, 0, Math.PI * 2); g.fill();
      if (!scared) {
        g.fillStyle = "#ffffff";
        for (let k = 0; k < 6; k++) {
          const a = k * Math.PI / 3;
          g.beginPath(); g.arc(s * r * 0.47 + Math.cos(a) * r * 0.045, r * 0.1 + Math.sin(a) * r * 0.045, r * 0.03, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = "#f2c230";
        g.beginPath(); g.arc(s * r * 0.47, r * 0.1, r * 0.03, 0, Math.PI * 2); g.fill();
      }
    }

    // hairline swept back over the top, with a little bun on top
    g.fillStyle = hair;
    g.beginPath();
    g.ellipse(0, -r * 0.5, r * 0.5, r * 0.26, 0, Math.PI, Math.PI * 2);
    g.lineTo(r * 0.5, -r * 0.42);
    g.quadraticCurveTo(0, -r * 0.62, -r * 0.5, -r * 0.42);
    g.fill();
    g.beginPath(); g.ellipse(0, -r * 0.8, r * 0.22, r * 0.14, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = hairHi; g.lineWidth = 0.9;
    for (const s of [-0.25, 0, 0.25]) {
      g.beginPath(); g.moveTo(s * r, -r * 0.45); g.quadraticCurveTo(s * r * 1.2, -r * 0.62, s * r * 0.6, -r * 0.74); g.stroke();
    }

    // freckles
    g.fillStyle = scared ? "rgba(40,50,140,0.35)" : "rgba(190,110,70,0.45)";
    for (const f of FRECKLES) {
      g.beginPath(); g.arc(f.x * r * 0.55, r * 0.06 + f.y * r * 0.16, r * 0.018, 0, Math.PI * 2); g.fill();
    }
    // nose
    g.strokeStyle = skinShade; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, -r * 0.04); g.quadraticCurveTo(r * 0.06, r * 0.1, -r * 0.03, r * 0.13); g.stroke();
    // mouth
    if (scared) {
      g.strokeStyle = "#fff"; g.lineWidth = 1.3;
      g.beginPath();
      for (let i = 0; i <= 6; i++) {
        const x = -r * 0.2 + i * r * 0.067, y = r * 0.27 + (i % 2 ? -r * 0.04 : r * 0.02);
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.stroke();
    } else {
      // closed, slightly knowing smile
      g.strokeStyle = "#b9707a"; g.lineWidth = 1.4; g.lineCap = "round";
      g.beginPath(); g.moveTo(-r * 0.16, r * 0.25); g.quadraticCurveTo(0, r * 0.33, r * 0.17, r * 0.23); g.stroke();
    }
  }

  // eyes (blue-grey) behind dark rectangular glasses: these float home when eaten
  const ey = -r * 0.1;
  const px = d.x * r * 0.05, py = d.y * r * 0.04;
  for (const s of [-1, 1]) {
    const ex = s * r * 0.2;
    g.fillStyle = "#ffffff";
    g.beginPath(); g.ellipse(ex, ey, r * 0.1, r * 0.075, 0, 0, Math.PI * 2); g.fill();
    if (scared) {
      g.fillStyle = "#222a70";
      g.beginPath(); g.arc(ex, ey, r * 0.035, 0, Math.PI * 2); g.fill();
    } else {
      g.fillStyle = "#6e8fa8";
      g.beginPath(); g.arc(ex + px, ey + py, r * 0.06, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#1a2028";
      g.beginPath(); g.arc(ex + px, ey + py, r * 0.03, 0, Math.PI * 2); g.fill();
    }
  }
  g.save();
  if (scared) g.rotate(0.12); // glasses knocked wonky
  g.strokeStyle = eyesOnly ? "#e6e8ee" : "#2f3338";
  g.lineWidth = Math.max(1.4, r * 0.075);
  g.lineJoin = "round";
  for (const s of [-1, 1]) {
    roundRect(g, s * r * 0.2 - r * 0.17, ey - r * 0.12, r * 0.34, r * 0.23, r * 0.05);
    g.stroke();
  }
  g.beginPath(); g.moveTo(-r * 0.03, ey - r * 0.04); g.lineTo(r * 0.03, ey - r * 0.04); g.stroke();
  g.beginPath(); g.moveTo(-r * 0.37, ey - r * 0.08); g.lineTo(-r * 0.46, ey - r * 0.1);
  g.moveTo(r * 0.37, ey - r * 0.08); g.lineTo(r * 0.46, ey - r * 0.1); g.stroke();
  g.restore();

  g.restore();
}

/* --------------------------- the maze --------------------------- */
let grid = [];
function tileAt(x, y) {
  if (y < 0 || y >= ROWS) return "#";
  if (x < 0 || x >= COLS) return y === TUNNEL_ROW ? " " : "#";
  return grid[y][x];
}
function isWall(c) { return c === "#"; }
function isVoid(x, y) {
  // spaces outside the hedge (rows 7 and 11 edges) are not walkable
  // check the original layout, so eaten tiles never turn into walls
  if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return false;
  return MAZE[y][x] === " " && (y === 7 || y === 11);
}
function walkable(x, y, forCat) {
  const c = tileAt(((x % COLS) + COLS) % COLS === x ? x : x, y);
  if (isWall(c) || isVoid(x, y)) return false;
  if (c === "-" || c === "G") return false; // door and basket are handled by the house logic
  return true;
}
function wrapX(x) {
  return ((x % COLS) + COLS) % COLS;
}
function canMove(tx, ty, dir) {
  const d = DIRS[dir];
  const nx = tx + d.x, ny = ty + d.y;
  if (ny === TUNNEL_ROW && (nx < 0 || nx >= COLS)) return true;
  return walkable(nx, ny);
}

// Pre-render hedges into an offscreen layer.
let wallLayer = null;
function buildWallLayer(flash = false) {
  const s = renderScale;
  const c = document.createElement("canvas");
  c.width = Math.ceil(W * s); c.height = Math.ceil(ROWS * T * s);
  const g = c.getContext("2d");
  g.scale(s, s);
  const isW = (x, y) => y >= 0 && y < ROWS && x >= 0 && x < COLS && MAZE[y][x] === "#";
  const base = flash ? "#f6ecd9" : "#1f6a42";
  const top = flash ? "#ffffff" : "#2f8f5b";
  const edge = flash ? "#ffffff" : "#7fe0a3";
  const inset = 3;
  // body of each hedge tile, joined to neighbours
  for (const [fill, pad] of [[edge, inset - 1.5], [base, inset], [top, inset + 2.5]]) {
    g.fillStyle = fill;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!isW(x, y)) continue;
      const px = x * T, py = y * T;
      const l = isW(x - 1, y) ? 0 : pad, r = isW(x + 1, y) ? 0 : pad;
      const u = isW(x, y - 1) ? 0 : pad, d = isW(x, y + 1) ? 0 : pad;
      roundRect(g, px + l, py + u, T - l - r, T - u - d, Math.min(6, pad + 2));
      g.fill();
      // fill corner gaps between diagonal-connected pieces
      if (!l && !u && !isW(x - 1, y - 1)) { g.fillRect(px, py + pad, pad, 0); }
    }
  }
  // holly berries scattered on hedges
  if (!flash) {
    g.fillStyle = "#e2475a";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      if (!isW(x, y)) continue;
      const h = (x * 73 + y * 151) % 17;
      if (h === 0 || h === 5) {
        g.beginPath(); g.arc(x * T + 9 + (h % 3) * 2, y * T + 10, 1.8, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(x * T + 12 + (h % 3) * 2, y * T + 12.5, 1.6, 0, Math.PI * 2); g.fill();
      }
    }
  }
  // cat-flap
  g.fillStyle = flash ? "#fff" : "#ffcf4a";
  roundRect(g, DOOR.x * T + 1, DOOR.y * T + T / 2 - 2, T - 2, 4, 2); g.fill();
  // basket floor
  g.fillStyle = flash ? "rgba(255,255,255,0.15)" : "rgba(255,207,74,0.08)";
  roundRect(g, 8 * T + 2, HOUSE_Y * T + 2, 5 * T - 4, T - 4, 8); g.fill();
  if (flash) wallFlashLayer = c; else wallLayer = c;
  if (!flash) buildWallLayer(true);
}
let wallFlashLayer = null;

/* --------------------------- game state ------------------------- */
const game = {
  state: "title",   // title | ready | play | dying | levelclear | gameover | paused
  stateTime: 0,
  score: 0,
  high: loadHigh(),
  lives: 3,
  level: 1,
  foodLeft: 0,
  foodTotal: 0,
  frightLeft: 0,
  catCombo: 0,
  modeIndex: 0,
  modeTime: 0,
  elapsed: 0,
  popups: [],
  bonus: null,
  bonusShown: 0,
  extraGiven: false,
  pausedFrom: null,
  eatenThisLevel: [],
};
const MODE_SCHEDULE = [["scatter", 7], ["chase", 20], ["scatter", 7], ["chase", 20], ["scatter", 5], ["chase", Infinity]];

const dog = { x: 10, y: 15, dir: "none", want: "none", face: -1, look: 0, mouth: 0, moving: false, chompT: 0 };
const cats = CAT_LOOKS.map((look, id) => ({ id, look, x: 0, y: 0, dir: "left", mode: "house", releaseAt: 0 }));

function speedScale() { return Math.min(1 + (game.level - 1) * 0.06, 1.3); }
function frightDuration() { return Math.max(1.5, 7 - (game.level - 1) * 0.8); }

function resetMaze() {
  grid = MAZE.map(row => row.split(""));
  game.foodLeft = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y][x];
    if (c === "." || c === "o") game.foodLeft++;
    if (c === "P") { grid[y][x] = " "; dog.startX = x; dog.startY = y; }
  }
  game.foodTotal = game.foodLeft;
  game.bonusShown = 0;
  game.bonus = null;
}

function resetActors() {
  Object.assign(dog, { x: dog.startX, y: dog.startY, dir: "left", want: "left", face: -1, look: 0, mouth: 0, moving: false });
  const starts = [[EXIT.x, EXIT.y, "outside"], [9, HOUSE_Y, "house"], [10, HOUSE_Y, "house"], [11, HOUSE_Y, "house"]];
  const lvl = Math.max(0.35, 1 - (game.level - 1) * 0.15);
  const releases = [0, 1.5 * lvl, 5 * lvl, 9 * lvl];
  cats.forEach((c, i) => {
    c.x = starts[i][0]; c.y = starts[i][1];
    c.mode = starts[i][2] === "outside" ? "normal" : "house";
    c.dir = i === 0 ? "left" : (i === 2 ? "up" : "down");
    c.releaseAt = releases[i];
    c.bobT = i;
  });
  game.frightLeft = 0;
  game.modeIndex = 0;
  game.modeTime = 0;
  game.elapsed = 0;
}

function newGame() {
  game.score = 0; game.lives = 3; game.level = 1; game.extraGiven = false;
  resetMaze(); resetActors();
  setState("ready");
  Sound.start();
}

function setState(s) { game.state = s; game.stateTime = 0; }

function currentMode() { return MODE_SCHEDULE[Math.min(game.modeIndex, MODE_SCHEDULE.length - 1)][0]; }

/* ---------------------------- movement -------------------------- */
const EPS = 1e-6;
function atCenter(e) { return Math.abs(e.x - Math.round(e.x)) < EPS && Math.abs(e.y - Math.round(e.y)) < EPS; }
function opposite(d) { return { up: "down", down: "up", left: "right", right: "left", none: "none" }[d]; }

// Move an entity along the grid by `dist` tiles, calling `decide` at every tile centre.
function moveEntity(e, dist, decide) {
  let guard = 0;
  while (dist > EPS && guard++ < 20) {
    if (atCenter(e)) {
      e.x = Math.round(e.x); e.y = Math.round(e.y);
      decide(e);
      if (e.dir === "none") return;
    }
    const d = DIRS[e.dir];
    let toCenter;
    if (d.x) {
      const target = d.x > 0 ? Math.floor(e.x + EPS) + 1 : Math.ceil(e.x - EPS) - 1;
      toCenter = Math.abs(target - e.x);
    } else {
      const target = d.y > 0 ? Math.floor(e.y + EPS) + 1 : Math.ceil(e.y - EPS) - 1;
      toCenter = Math.abs(target - e.y);
    }
    const step = Math.min(dist, toCenter);
    e.x += d.x * step; e.y += d.y * step;
    dist -= step;
    if (Math.abs(step - toCenter) < EPS) { e.x = Math.round(e.x); e.y = Math.round(e.y); }
    // tunnel wrap
    if (e.x < -1) e.x += COLS + 1;
    else if (e.x > COLS) e.x -= COLS + 1;
  }
}
function tileOf(e) { return { x: Math.round(e.x), y: Math.round(e.y) }; }
function inTunnel(e) { return Math.round(e.y) === TUNNEL_ROW && (e.x < 4 || e.x > COLS - 5); }

function updateDog(dt) {
  // instant reversal between tiles
  if (dog.want !== "none" && dog.want === opposite(dog.dir)) dog.dir = dog.want;
  const sp = 7.6 * speedScale() * (game.frightLeft > 0 ? 1.08 : 1);
  const before = { x: dog.x, y: dog.y };
  moveEntity(dog, sp * dt, (e) => {
    const tx = Math.round(e.x), ty = Math.round(e.y);
    eatAt(tx, ty);
    if (e.want !== "none" && canMove(tx, ty, e.want)) e.dir = e.want;
    else if (!canMove(tx, ty, e.dir)) e.dir = "none";
  });
  dog.moving = Math.abs(before.x - dog.x) + Math.abs(before.y - dog.y) > 0;
  if (dog.dir === "left") dog.face = -1;
  if (dog.dir === "right") dog.face = 1;
  const targetLook = dog.dir === "up" ? -1 : dog.dir === "down" ? 1 : 0;
  dog.look += (targetLook - dog.look) * Math.min(1, dt * 12);
  if (dog.moving) dog.chompT += dt * 14;
  dog.mouth = dog.moving ? (Math.sin(dog.chompT) * 0.5 + 0.5) : Math.max(0, dog.mouth - dt * 4);
  // eat while passing through the centre zone
  const t = tileOf(dog);
  if (Math.abs(dog.x - t.x) < 0.35 && Math.abs(dog.y - t.y) < 0.35) eatAt(t.x, t.y);
}

function eatAt(x, y) {
  if (y < 0 || y >= ROWS) return;
  x = wrapX(x);
  const c = grid[y][x];
  if (c === ".") {
    grid[y][x] = " "; addScore(10); game.foodLeft--; Sound.chomp();
  } else if (c === "o") {
    grid[y][x] = " "; addScore(50); game.foodLeft--;
    startFright();
  } else return;
  const eaten = game.foodTotal - game.foodLeft;
  if ((eaten === 70 && game.bonusShown === 0) || (eaten === 150 && game.bonusShown === 1)) {
    game.bonusShown++;
    game.bonus = { x: dog.startX, y: dog.startY, left: 9.5 };
  }
  if (game.foodLeft <= 0) { setState("levelclear"); }
}

function startFright() {
  Sound.bone();
  game.frightLeft = frightDuration();
  game.catCombo = 0;
  for (const c of cats) {
    if (c.mode === "normal") { c.mode = "frightened"; c.dir = opposite(c.dir); }
    else if (c.mode === "house" || c.mode === "leaving") c.scaredInHouse = true;
  }
}

function addScore(n) {
  game.score += n;
  if (!game.extraGiven && game.score >= 10000) { game.extraGiven = true; game.lives++; Sound.extra(); }
  if (game.score > game.high) { game.high = game.score; saveHigh(game.high); }
}

function catTarget(c) {
  const mode = currentMode();
  const dt = tileOf(dog);
  if (mode === "scatter") return [[COLS + 1, -3], [-2, -3], [COLS + 1, ROWS + 2], [-2, ROWS + 2]][c.id];
  const d = DIRS[dog.dir === "none" ? "left" : dog.dir];
  switch (c.id) {
    case 0: return [dt.x, dt.y]; // Ginger: straight at the dog
    case 1: return [dt.x + d.x * 4, dt.y + d.y * 4]; // Smokey: heads you off
    case 2: { // Mittens: flanks, mirrored off Ginger
      const p = [dt.x + d.x * 2, dt.y + d.y * 2];
      const g0 = tileOf(cats[0]);
      return [p[0] * 2 - g0.x, p[1] * 2 - g0.y];
    }
    default: { // Duchess: chases when far, wanders off when close
      const ct = tileOf(c);
      const dist = Math.hypot(ct.x - dt.x, ct.y - dt.y);
      return dist > 7 ? [dt.x, dt.y] : [-2, ROWS + 2];
    }
  }
}

function chooseDir(c, target, random) {
  const tx = Math.round(c.x), ty = Math.round(c.y);
  const options = DIR_ORDER.filter(d => d !== opposite(c.dir) && canMove(tx, ty, d));
  if (!options.length) return opposite(c.dir);
  if (random) return options[Math.floor(Math.random() * options.length)];
  let best = options[0], bestD = Infinity;
  for (const d of options) {
    const nx = tx + DIRS[d].x, ny = ty + DIRS[d].y;
    const dd = (nx - target[0]) ** 2 + (ny - target[1]) ** 2;
    if (dd < bestD - 1e-9) { bestD = dd; best = d; }
  }
  return best;
}

function updateCat(c, dt) {
  const base = 7.1 * speedScale();
  c.bobT += dt;
  switch (c.mode) {
    case "house": {
      c.y = HOUSE_Y + Math.sin(c.bobT * 5) * 0.18;
      c.dir = Math.cos(c.bobT * 5) > 0 ? "down" : "up";
      if (game.elapsed >= c.releaseAt) { c.mode = "leaving"; c.y = HOUSE_Y; }
      break;
    }
    case "leaving": {
      const sp = 3.5 * dt;
      if (Math.abs(c.x - DOOR.x) > EPS) {
        const dx = Math.sign(DOOR.x - c.x);
        c.dir = dx > 0 ? "right" : "left";
        c.x += dx * Math.min(sp, Math.abs(DOOR.x - c.x));
        c.y += (HOUSE_Y - c.y) * Math.min(1, dt * 10);
      } else {
        c.dir = "up";
        c.y -= sp;
        if (c.y <= EXIT.y) {
          c.y = EXIT.y; c.dir = Math.random() < 0.5 ? "left" : "right";
          c.mode = (game.frightLeft > 0 && c.scaredInHouse) ? "frightened" : "normal";
          c.scaredInHouse = false;
        }
      }
      break;
    }
    case "eaten": {
      moveEntity(c, 15 * dt, (e) => {
        if (Math.round(e.x) === EXIT.x && Math.round(e.y) === EXIT.y) { e.mode = "entering"; e.dir = "down"; return; }
        e.dir = chooseDir(e, [EXIT.x, EXIT.y], false);
      });
      if (c.mode === "entering") c.dir = "down";
      break;
    }
    case "entering": {
      c.y += 8 * dt;
      if (c.y >= HOUSE_Y) { c.y = HOUSE_Y; c.mode = "leaving"; c.scaredInHouse = false; }
      break;
    }
    case "frightened":
    case "normal": {
      const scared = c.mode === "frightened";
      let sp = scared ? base * 0.6 : base;
      if (inTunnel(c)) sp *= 0.5;
      // Ginger speeds up when few pigs in blankets are left
      if (c.id === 0 && !scared && game.foodLeft < 25) sp *= 1.08;
      moveEntity(c, sp * dt, (e) => { e.dir = chooseDir(e, catTarget(e), e.mode === "frightened"); });
      break;
    }
  }
}

function checkCollisions() {
  for (const c of cats) {
    if (c.mode !== "normal" && c.mode !== "frightened") continue;
    let dx = Math.abs(c.x - dog.x);
    if (dx > COLS / 2) dx = COLS + 1 - dx;
    if (dx < 0.6 && Math.abs(c.y - dog.y) < 0.6) {
      if (c.mode === "frightened") {
        game.catCombo++;
        const pts = 200 * 2 ** (game.catCombo - 1);
        addScore(pts);
        game.popups.push({ x: c.x, y: c.y, text: String(pts), left: 1 });
        c.mode = "eaten";
        Sound.eatCat();
        game.freeze = 0.45;
      } else {
        Sound.death();
        setState("dying");
        return;
      }
    }
  }
  if (game.bonus) {
    if (Math.abs(game.bonus.x - dog.x) < 0.6 && Math.abs(game.bonus.y - dog.y) < 0.6) {
      const pts = 100 * Math.min(game.level, 8) + 200;
      addScore(pts);
      game.popups.push({ x: game.bonus.x, y: game.bonus.y, text: String(pts), left: 1.4 });
      game.bonus = null;
      Sound.bonus();
    }
  }
}

/* ------------------------------ loop ---------------------------- */
let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(frame);
}

function update(dt) {
  game.stateTime += dt;
  for (const p of game.popups) p.left -= dt;
  game.popups = game.popups.filter(p => p.left > 0);

  switch (game.state) {
    case "ready":
      if (game.stateTime > 2.2) setState("play");
      break;
    case "play": {
      if (game.freeze > 0) { game.freeze -= dt; break; }
      game.elapsed += dt;
      if (game.frightLeft > 0) {
        game.frightLeft -= dt;
        if (game.frightLeft <= 0) {
          game.frightLeft = 0;
          for (const c of cats) if (c.mode === "frightened") c.mode = "normal";
        }
      } else {
        game.modeTime += dt;
        const [, dur] = MODE_SCHEDULE[Math.min(game.modeIndex, MODE_SCHEDULE.length - 1)];
        if (game.modeTime >= dur) {
          game.modeTime = 0; game.modeIndex++;
          for (const c of cats) if (c.mode === "normal") c.dir = opposite(c.dir);
        }
      }
      if (game.bonus) { game.bonus.left -= dt; if (game.bonus.left <= 0) game.bonus = null; }
      updateDog(dt);
      if (game.state !== "play") break;
      checkCollisions();
      if (game.state !== "play") break;
      for (const c of cats) updateCat(c, dt);
      checkCollisions();
      break;
    }
    case "dying":
      if (game.stateTime > 2) {
        game.lives--;
        if (game.lives <= 0) { setState("gameover"); }
        else { resetActors(); setState("ready"); }
      }
      break;
    case "levelclear":
      if (game.stateTime > 2.4) {
        game.level++;
        resetMaze(); resetActors();
        setState("ready");
        Sound.bark(); Sound.bark(0.18);
      }
      break;
  }
}

/* ---------------------------- rendering ------------------------- */
const FONT_DISPLAY = '"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
const FONT_BODY = '"Nunito", "Segoe UI", system-ui, sans-serif';

function render(t) {
  ctx.fillStyle = "#120f24";
  ctx.fillRect(0, 0, W, H);

  // HUD
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#b9b0d6";
  ctx.font = `800 11px ${FONT_BODY}`;
  ctx.textAlign = "left";
  ctx.fillText("SCORE", 14, 14);
  ctx.textAlign = "center";
  ctx.fillText("BACHMAN", W / 2, 14);
  ctx.textAlign = "right";
  ctx.fillText("BEST", W - 14, 14);
  ctx.font = `24px ${FONT_DISPLAY}`;
  ctx.fillStyle = "#ffcf4a";
  ctx.textAlign = "left";
  ctx.fillText(String(game.score), 14, 33);
  ctx.textAlign = "right";
  ctx.fillText(String(game.high), W - 14, 33);
  ctx.textAlign = "center";
  ctx.fillStyle = "#f6ecd9";
  ctx.fillText("Level " + game.level, W / 2, 33);

  // maze
  ctx.save();
  ctx.translate(0, HUD_TOP);
  const flashing = game.state === "levelclear" && Math.floor(game.stateTime * 4) % 2 === 1;
  const layer = flashing ? wallFlashLayer : wallLayer;
  if (layer) ctx.drawImage(layer, 0, 0, W, ROWS * T);

  // food
  const pulse = 0.85 + Math.sin(t * 6) * 0.15;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = grid[y] && grid[y][x];
    if (c === ".") ctx.drawImage(pigSprite, x * T, y * T, T, T);
    else if (c === "o") {
      const s = T * 1.35 * pulse;
      ctx.drawImage(boneSprite, x * T + T / 2 - s / 2, y * T + T / 2 - s / 2, s, s);
    }
  }
  if (game.bonus) {
    const s = T * 1.4, b = Math.sin(t * 4) * 1.5;
    ctx.drawImage(puddingSprite, game.bonus.x * T + T / 2 - s / 2, game.bonus.y * T + T / 2 - s / 2 + b, s, s);
  }
  ctx.restore();

  // actors
  const showActors = game.state !== "title" && game.state !== "gameover";
  if (showActors) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, HUD_TOP, W, ROWS * T); ctx.clip();
    if (game.state !== "dying" || game.stateTime < 0.6) {
      if (game.state !== "levelclear") for (const c of cats) drawCat(ctx, c, t);
    }
    drawDogActor(t);
    ctx.restore();
  }

  // score popups
  ctx.font = `16px ${FONT_DISPLAY}`;
  ctx.textAlign = "center";
  for (const p of game.popups) {
    ctx.globalAlpha = Math.min(1, p.left * 2);
    ctx.fillStyle = "#7fe0ff";
    ctx.fillText(p.text, p.x * T + T / 2, p.y * T + T / 2 + HUD_TOP - (1 - p.left) * 14);
  }
  ctx.globalAlpha = 1;

  // lives + level food
  const by = HUD_TOP + ROWS * T + HUD_BOTTOM / 2;
  for (let i = 0; i < Math.max(0, game.lives - (game.state === "ready" || game.state === "title" ? 1 : 0)); i++) {
    drawDog(ctx, 22 + i * 30, by, 11, 1, 0, 0, { t });
  }
  for (let i = 0; i < Math.min(game.level, 7); i++) {
    ctx.drawImage(pigSprite, W - 30 - i * 24, by - T / 2, T, T);
  }
  if (Sound.muted) {
    ctx.font = `800 11px ${FONT_BODY}`;
    ctx.fillStyle = "#b9b0d6";
    ctx.textAlign = "center";
    ctx.fillText("SOUND OFF (M)", W / 2, by);
  }

  // messages
  const midY = HUD_TOP + 11 * T + T / 2;
  if (game.state === "ready") banner("READY!", "#ffcf4a", HUD_TOP + 15 * T + T / 2 + 22, 22);
  if (game.state === "paused") overlay("Paused", "Press P or tap to carry on");
  if (game.state === "gameover") overlay("Game over", `Score ${game.score} · Press Enter or tap to play again`);
  if (game.state === "title") titleScreen(t);
}

function drawDogActor(t) {
  const cx = dog.x * T + T / 2, cy = dog.y * T + T / 2 + HUD_TOP;
  const r = T * 0.78;
  if (game.state === "dying") {
    const k = Math.min(1, game.stateTime / 1.6);
    drawDog(ctx, cx, cy, r, dog.face, dog.look, 0.3, { rotate: k * Math.PI * 4, scale: 1 - k * 0.95, dizzy: true, t });
    return;
  }
  // draw again on the far side while passing through the tunnel
  drawDog(ctx, cx, cy, r, dog.face, dog.look, dog.mouth, { t, moving: dog.moving });
  if (dog.x < 0.5) drawDog(ctx, cx + (COLS + 1) * T, cy, r, dog.face, dog.look, dog.mouth, { t });
  if (dog.x > COLS - 1.5) drawDog(ctx, cx - (COLS + 1) * T, cy, r, dog.face, dog.look, dog.mouth, { t });
}

function banner(text, color, y, size) {
  ctx.font = `${size}px ${FONT_DISPLAY}`;
  ctx.textAlign = "center";
  ctx.lineWidth = 5; ctx.strokeStyle = "#120f24";
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

function overlay(title, sub) {
  ctx.fillStyle = "rgba(18,15,36,0.78)";
  ctx.fillRect(0, HUD_TOP, W, ROWS * T);
  banner(title, "#ffcf4a", HUD_TOP + ROWS * T / 2 - 14, 40);
  ctx.font = `700 14px ${FONT_BODY}`;
  ctx.fillStyle = "#f6ecd9";
  ctx.fillText(sub, W / 2, HUD_TOP + ROWS * T / 2 + 22);
}

function titleScreen(t) {
  ctx.fillStyle = "rgba(18,15,36,0.86)";
  ctx.fillRect(0, HUD_TOP, W, ROWS * T);
  const top = HUD_TOP + 70;
  drawDog(ctx, W / 2, top + 10, 46, Math.sin(t * 1.5) > 0 ? 1 : -1, 0, Math.sin(t * 8) * 0.5 + 0.5, { t, moving: true });
  banner("BACHMAN", "#ffcf4a", top + 92, 54);
  ctx.font = `700 14px ${FONT_BODY}`;
  ctx.fillStyle = "#f6ecd9";
  ctx.textAlign = "center";
  ctx.fillText("A hungry Havanese, a maze, and a lot of pigs in blankets.", W / 2, top + 132);

  const rowY = top + 175;
  const items = [
    ["pig", "Pig in blanket", "10"],
    ["bone", "Bone: turn the tables!", "50"],
    ["pud", "Christmas pudding", "bonus"],
  ];
  ctx.textAlign = "left";
  items.forEach(([kind, label, pts], i) => {
    const y = rowY + i * 32, x = W / 2 - 130;
    const sp = kind === "pig" ? pigSprite : kind === "bone" ? boneSprite : puddingSprite;
    const s = kind === "pig" ? T * 1.2 : T * 1.3;
    ctx.drawImage(sp, x - s / 2, y - s / 2, s, s);
    ctx.font = `700 15px ${FONT_BODY}`;
    ctx.fillStyle = "#f6ecd9";
    ctx.fillText(label, x + 24, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffcf4a";
    ctx.font = `17px ${FONT_DISPLAY}`;
    ctx.fillText(pts, W / 2 + 140, y);
    ctx.textAlign = "left";
  });

  // the chasers
  const cy = rowY + 120;
  ctx.font = `700 12px ${FONT_BODY}`;
  ctx.textAlign = "center";
  cats.forEach((c, i) => {
    const fake = { ...c, x: (W / 2 - 135 + i * 90) / T - 0.5, y: (cy - HUD_TOP) / T - 0.5, mode: "normal", dir: "down" };
    drawCat(ctx, fake, t);
    ctx.fillStyle = c.look.label;
    ctx.fillText(c.look.name, W / 2 - 135 + i * 90, cy + 30);
  });

  const blink = Math.floor(t * 2) % 2 === 0;
  if (blink) banner("Press Enter or tap to start", "#7fe0a3", cy + 75, 22);
}

/* ------------------------------ input --------------------------- */
const KEYMAP = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
};
function steer(dir) {
  Sound.unlock();
  if (game.state === "title" || game.state === "gameover") { newGame(); return; }
  if (game.state === "paused") return;
  dog.want = dir;
}
function primary() {
  Sound.unlock();
  if (game.state === "title" || game.state === "gameover") newGame();
  else if (game.state === "paused") { game.state = game.pausedFrom; }
}
function togglePause() {
  if (game.state === "play" || game.state === "ready") { game.pausedFrom = game.state; game.state = "paused"; }
  else if (game.state === "paused") game.state = game.pausedFrom;
}
window.addEventListener("keydown", (e) => {
  if (KEYMAP[e.key]) { e.preventDefault(); steer(KEYMAP[e.key]); return; }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); primary(); return; }
  if (e.key === "p" || e.key === "P" || e.key === "Escape") { togglePause(); return; }
  if (e.key === "m" || e.key === "M") Sound.toggle();
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && (game.state === "play" || game.state === "ready")) togglePause();
});

// swipe
let touchStart = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.focus();
  touchStart = { x: e.clientX, y: e.clientY, moved: false };
});
canvas.addEventListener("pointermove", (e) => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  if (Math.hypot(dx, dy) > 22) {
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    touchStart = { x: e.clientX, y: e.clientY, moved: true };
  }
});
canvas.addEventListener("pointerup", () => {
  if (touchStart && !touchStart.moved) primary();
  touchStart = null;
});
document.querySelectorAll(".pad button").forEach((b) => {
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); steer(b.dataset.dir); });
});

/* ------------------------------ boot ---------------------------- */
resetMaze();
resetActors();
resize();
canvas.focus();
requestAnimationFrame((t) => { last = t; frame(t); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => buildWallLayer());

// test hook
window.__bachman = { game, dog, cats, newGame };
})();
</script>
</body>
</html>
